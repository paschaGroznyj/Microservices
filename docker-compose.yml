services:
  broker:
    image: apache/kafka:4.1.0
    container_name: broker
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9093:9093"
      - "9094:9094"
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.28.0.10:9092,EXTERNAL://172.18.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms128m"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_RETENTION_BYTES: 1073741824

      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped
    networks:
      catchPM:
        ipv4_address: 172.28.0.10

  agent_service:
    build: ./agent_service
    container_name: agent_service
    ports:
      - "9001:9001"
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      PORT_GATEWAY_SIGMA_PORT: ${PORT_GATEWAY_SIGMA_PORT:-7010}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      KAFKA_BROKER: ${KAFKA_BROKER}

      STORAGE_PATH: ${STORAGE_PATH}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      ARTICLES_FOLDER: ${ARTICLES_FOLDER}
      METADATA_FOLDER: ${METADATA_FOLDER}
      FAISS_FOLDER: ${FAISS_FOLDER}
      DIGESTS_FOLDER: ${DIGESTS_FOLDER}

      OBS_BUCKET: ${OBS_BUCKET}
      OBS_OPEN_BUCKET: ${OBS_OPEN_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      DIGEST_RECIPIENTS: ${DIGEST_RECIPIENTS}
      DIGEST_SCHEDULE_DAY_OF_WEEK: ${DIGEST_SCHEDULE_DAY_OF_WEEK}
      DIGEST_SCHEDULE_HOUR: ${DIGEST_SCHEDULE_HOUR}
      DIGEST_SCHEDULE_MINUTE: ${DIGEST_SCHEDULE_MINUTE}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE}
      DIGEST_ENABLED: ${DIGEST_ENABLED}
      DIGEST_RUN_MODE: ${DIGEST_RUN_MODE}
      DIGEST_UPLOAD_TO_OBS: ${DIGEST_UPLOAD_TO_OBS}

      FERNET_KEY: ${FERNET_KEY}

      CLOUD_LLM_ACCESS_KEY: ${CLOUD_LLM_ACCESS_KEY}


      # RouterAPI (routerai.ru) — paid media provider for admin-only
      # generate_video / generate_audio tools.
      ROUTER_API_KEY: ${ROUTER_API_KEY}
      ROUTER_API_BASE_URL: ${ROUTER_API_BASE_URL}
      # ASR (голосовые TG): cloud_ru (whisper) | routerapi (mai-transcribe-2)
      TG_ASR_PROVIDER: ${TG_ASR_PROVIDER:-cloud_ru}

      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}

      ADMINS_INFO: ${ADMINS_INFO}
      AGENT_POOL_PASSWORD: ${AGENT_POOL_PASSWORD}
      SANDBOX_SERVICE_URL: ${SANDBOX_SERVICE_URL}
      TG_BOT_PUSH_URL: http://172.18.0.1:8010/push_message # docker network inspect pascha_microservices | grep Gateway
      TG_INLINE_B64_MAX: "700000"  # > порог = file_url вместо base64 в Kafka
      # sudo ufw allow from 172.18.0.0/16 to any port 8010 proto tcp

    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - ./agent_service:/app
      - ./agent_service/sandbox:/sandbox:rw
    restart: unless-stopped
    networks:
      - catchPM
      - sandbox_net

  tg_bot:
      build: ./telegram_service
      container_name: tg_bot
      network_mode: "host"  # Используем сеть сервера напрямую (TG API + порты хоста)
      environment:
        TELEGRAM_BOT_TOKEN:  ${TELEGRAM_BOT_TOKEN}
        # Стучимся в контейнеры через проброшенные порты хоста (host-режим):
        CHATS_SERVICE_URL:   http://127.0.0.1:8001   # send_message (Kafka) + /tg/*
        AGENT_SERVICE_URL:   http://127.0.0.1:9001   # оркестратор /api/tg/should_respond
        TG_ASR_PROVIDER:     ${TG_ASR_PROVIDER:-cloud_ru}   # провайдер распознавания голосовых
        REDIS_URL:           redis://127.0.0.1:6379/0
        TG_PUSH_PORT:        "8010"
        ORCH_THROTTLE_SEC:   "6"
        BUF_MAXLEN:          "40"
        BUF_TTL:             "3600"
        # Ссылка для гейта регистрации в /start (незарегистрированный чат):
        CATCHPM_URL:         https://catchpm.cds.uva-advanced.ru
        # Проактивные триггеры (будильники завтрак/обед/ужин + poke):
        TG_TZ:               Europe/Moscow
        TG_POKE_PROBABILITY: "0.18"   # вероятность дёрнуть чат на тике poke
        TG_POKE_HOUR_START:  "10"      # окно адресных poke [start, end) МСК
        TG_POKE_HOUR_END:    "18"      # до 18 (слоты 9/13 внутри исключаются вероятностью)
        TG_POKE_JITTER_MIN:  "15"      # ± минут джиттер запуска poke от ровного часа
        TG_SAD_WAIT_LO:      "300"     # окно ожидания ответа (грусть), сек, low
        TG_SAD_WAIT_HI:      "600"     # окно ожидания ответа (грусть), сек, high
        TG_POKE_DAILY_TTL:   "86400"   # суточный throttle адресных poke на чат
        TG_DEBUG_TOKEN:      ${TG_DEBUG_TOKEN:-}  # если пусто — /tg/debug/trigger ОТКЛЮЧЁН (404)
        # Тот же источник, что и у agent_service: tg_id админов берётся из ADMINS_INFO
        # (поле tg_id). Нужен, чтобы в /start-меню показывать админские категории тулов.
        ADMINS_INFO:         ${ADMINS_INFO}
      restart: unless-stopped


  # token_service:
  #   build: ./token_service
  #   container_name: token_service
  #   ports:
  #     - "9004:9004"
  #   environment:
  #     INTERNAL_TOKEN_API_URL: ${INTERNAL_TOKEN_API_URL}
  #     PORT_TOKEN_GENERATE_SERVICE: ${PORT_TOKEN_GENERATE_SERVICE}
  #     TOKEN_TTL: ${TOKEN_TTL}
  #     IAM_API_KEY: ${IAM_API_KEY}
  #   restart: unless-stopped

  parsers_service:
   build: ./parsers_service
   container_name: parsers_service
   ports:
     - "8003:8003"
   environment:
     PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
     PORT_PM_AGENT: ${PORT_PM_AGENT}
     STORAGE_PATH: ${STORAGE_PATH}
     SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
     SYNC_INTERVAL_SCHEDULER: ${SYNC_INTERVAL_SCHEDULER}
     ARTICLES_FOLDER: ${ARTICLES_FOLDER}
     METADATA_FOLDER: ${METADATA_FOLDER}

     OBS_BUCKET: ${OBS_BUCKET}
     OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
     OBS_SECRET_KEY: ${OBS_SECRET_KEY}
     OBS_REGION: ${OBS_REGION}
     OBS_ENDPOINT: ${OBS_ENDPOINT}

     DB_HOST: ${DB_HOST}
     DB_PORT: ${DB_PORT}
     DB_USER: ${DB_USER}
     DB_PASSWORD: ${DB_PASSWORD}
     DB_NAME: ${DB_NAME}

     SCRAPINGDOG_API_KEY: ${SCRAPINGDOG_API_KEY} # Мой ключ по умолчанию для всех
   depends_on:
    - postgres
   volumes:
     - ./parsers_service:/app
   restart: unless-stopped
   networks:
      - catchPM


  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - catchPM
  
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - catchPM

  gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "7000:7000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      PORT_GATEWAY_SIGMA_PORT: ${PORT_GATEWAY_SIGMA_PORT:-7010}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./api_gateway:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - catchPM

  # SIGMA-фронт: копия gateway без WebSocket и без загрузки файлов.
  # Обратный канал агент→фронт заменён на GET-polling + собственный
  # Kafka-consumer (group_id=sigma-gateway-group). Kafka общая с основным
  # gateway. Порт 7010 (nginx на хосте настраивается отдельно).
  gateway_sigma:
    build: ./api_gateway_sigma
    container_name: api_gateway_sigma
    command: uvicorn app:app --host 0.0.0.0 --port 7010
    ports:
      - "7010:7010"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_SIGMA_PORT:-7010}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      KAFKA_BROKER: ${KAFKA_BROKER}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./api_gateway_sigma:/app
    depends_on:
      broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - catchPM

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
        PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
        PORT_PM_AGENT: ${PORT_PM_AGENT}
        SECRET_KEY: ${SECRET_KEY}
        ALGORITHM: ${ALGORITHM}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}

        FERNET_KEY: ${FERNET_KEY}
    depends_on:
      - postgres
    volumes:
      - ./auth_service:/app
    restart: unless-stopped
    networks:
      - catchPM

  # postgres_old:
  #     image: postgres:15
  #     container_name: postgres
  #     environment:
  #       POSTGRES_DB: ${DB_NAME}           # Особенность Postgres
  #       POSTGRES_USER: ${DB_USER}
  #       POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     ports:
  #       - "5433:5432"
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      # Настройки PostgreSQL для производительности и автоочистки
      command: >
        postgres
        -c autovacuum=on
        -c max_connections=300
        -c autovacuum_vacuum_scale_factor=0.2
        -c autovacuum_vacuum_threshold=5000
        -c autovacuum_vacuum_cost_delay=20ms
        -c min_wal_size=500MB
        -c max_wal_size=2GB
        -c wal_keep_size=0
        -c checkpoint_timeout=15min
        -c log_min_duration_statement=1000
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups
      - wal_archive:/var/lib/postgresql/wal_archive

    logging:
      # Ограничение размера логов, чтобы контейнер не раздувало
      driver: "json-file"
      options:
        max-size: "10m"      # Каждый файл лога максимум 10MB
        max-file: "3"         # Хранить не больше 3 файлов
        compress: "true"      # Сжимать старые логи
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s # Даем время на первый запуск и инициализацию
    
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c max_wal_size=2GB
      -c min_wal_size=500MB
    networks:
      - catchPM

  chats_service:
    container_name: chats_service
    build: ./chats_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
      OBS_BUCKET: ${OBS_BUCKET}
      OBS_OPEN_BUCKET: ${OBS_OPEN_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent_service:9001}
      TG_ASR_PROVIDER: ${TG_ASR_PROVIDER:-cloud_ru}
      ACTIVITY_TOKEN: ${ACTIVITY_TOKEN}
      ACTIVITY_URL: ${ACTIVITY_URL}
      ACTIVITY_DEPARTMENT: ${ACTIVITY_DEPARTMENT:-cds}
      LOOP_HARD_LIMIT_RUB: ${LOOP_HARD_LIMIT_RUB:-200}
      BUDGET_CACHE_TTL: ${BUDGET_CACHE_TTL:-900}
    volumes:
      - ./chats_service:/app
    depends_on:
      - postgres
      - broker
      - redis
    restart: unless-stopped
    networks:
      - catchPM

  chats-consumer:
    container_name: chats-consumer
    build: ./chats_service
    command: python -m app.endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_SIGMA_PORT: ${PORT_GATEWAY_SIGMA_PORT:-7010}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TG_BOT_PUSH_URL: "http://host.docker.internal:8010/push_message"
      # САМОЦИКЛ: реентри-POST в /send_message того же chats_service (docker-сеть)
      CHATS_SERVICE_SELF_URL: ${CHATS_SERVICE_SELF_URL:-http://chats_service:8001}
      ACTIVITY_TOKEN: ${ACTIVITY_TOKEN}
      ACTIVITY_URL: ${ACTIVITY_URL}
    volumes:
      - ./chats_service:/app
    depends_on:
      - postgres
      - broker
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - catchPM

  group-chat-consumer:
    container_name: group-chat-consumer
    build: ./chats_service
    command: python -m app.group_endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_SIGMA_PORT: ${PORT_GATEWAY_SIGMA_PORT:-7010}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    volumes:
      - ./chats_service:/app
    depends_on:
      - postgres
      - broker
    restart: unless-stopped
    networks:
      - catchPM



  agent_sandbox:
    build: ./agent_sandbox
    container_name: agent_sandbox
    read_only: true
    depends_on:
      - broker
    ports:
      - "8005:8005"
    ipc: host
    tmpfs:
      - /tmp/exec:size=256m,uid=1500,mode=0700 
      - /tmp:size=3g,mode=1777,exec,uid=1500       
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - catchPM
    mem_limit: 4g                     
    memswap_limit: 4g
    cpus: "4.0"
    environment:
      - OPENBLAS_NUM_THREADS=8
      - OMP_NUM_THREADS=8
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_LOGIN=${MAIL_LOGIN}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT}
      - GITVERSE_TOKEN=${GITVERSE_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - DOCKER_HOST=tcp://sandbox_dind:2375
      - KAFKA_BROKER_DIND=172.28.0.10:9092    # для контейнеров, которые agent_sandbox поднимает внутри dind
    volumes:
      - ./agent_sandbox/fonts:/app/fonts:ro
      - ./agent_sandbox/dev_utils:/app/dev_utils:ro
      - ./agent_sandbox/result_parsing:/app/result_parsing:ro
      - ./agent_sandbox/workspaces:/tmp/exec/workspaces:rw
    restart: unless-stopped

  sandbox_dind:
    image: docker:24-dind
    container_name: sandbox_dind
    privileged: true 
    environment:
      - DOCKER_TLS_CERTDIR=
    networks:
      - catchPM
    ports:
      - "2375:2375"
      - "18000-18050:18000-18050" # <--- Выделяем 50 портов под сервисы
      # - "127.0.0.1:28000-28050:18000-18050"
    volumes:
      - ./agent_sandbox/output:/tmp/output:rw
      - dind_data:/var/lib/docker
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"


  

volumes:
  kafka-data:
  llm_cache:
  postgres_data:
  neo4j_data:
  dind_data:
  wal_archive:
  redis_data:
#  parser_data:
#  parser_logs:

networks:
  catchPM:
    name: pascha_microservices
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  
  sandbox_net:
      driver: bridge