services:
  db:
    image: postgres:16
    container_name: research_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: research_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: research_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: research_db
      DB_USER: research_user
      DB_PASSWORD: research_pass
      PIPELINE_OUTPUT_JSON: /app/output/pipeline_results.json
      LOG_PATH: /app/output/research_pipeline.log
    volumes:
      - ./:/app
    working_dir: /app
    stdin_open: true
    tty: true
    command: python app/main.py

volumes:
  postgres_data:
