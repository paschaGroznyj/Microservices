<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · CatchPM</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"><rect x="3" y="4" width="10" height="9" rx="2" stroke="%238b4513" stroke-width="1.5"/><circle cx="6" cy="8" r="1" fill="%238b4513"/><circle cx="10" cy="8" r="1" fill="%238b4513"/><path d="M8 4V2" stroke="%238b4513" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="1.5" r="0.5" fill="%238b4513"/><path d="M5 13v1M11 13v1" stroke="%238b4513" stroke-width="1.5" stroke-linecap="round"/></svg>' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<div class="auth-page">

    <button class="theme-toggle auth-theme" id="theme-toggle" type="button" title="Сменить тему" aria-label="Сменить тему">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
    </button>

    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">
                <svg viewBox="0 0 16 16" fill="none">
                    <rect x="3" y="4" width="10" height="9" rx="2" stroke="currentColor" stroke-width="1.3"/>
                    <circle cx="6" cy="8" r="1" fill="currentColor"/>
                    <circle cx="10" cy="8" r="1" fill="currentColor"/>
                    <path d="M8 4V2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    <circle cx="8" cy="1.5" r="0.6" fill="currentColor"/>
                    <path d="M5 13v1M11 13v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="auth-title">Регистрация</div>
            <div class="auth-subtitle">Создайте аккаунт для доступа к CatchPM</div>
        </div>

        {% if error %}
        <div class="auth-alert auth-alert-error">{{ error }}</div>
        {% endif %}

        <form class="auth-form" method="post" action="/register-web" id="register-form">
            <div class="auth-field">
                <label class="auth-label" for="username">Логин</label>
                <input class="auth-input" id="username" name="username" type="text"
                       placeholder="Придумайте логин" autocomplete="username" required autofocus>
            </div>

            <div class="auth-field">
                <label class="auth-label" for="password">Пароль</label>
                <div class="auth-input-wrap">
                    <input class="auth-input" id="password" name="password" type="password"
                           placeholder="Минимум 6 символов" autocomplete="new-password" minlength="6" required>
                    <button class="auth-eye" type="button" data-target="password" aria-label="Показать пароль">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A18.5 18.5 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 4-.94"/><path d="m2 2 20 20"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="auth-field">
                <label class="auth-label" for="password2">Повторите пароль</label>
                <div class="auth-input-wrap">
                    <input class="auth-input" id="password2" type="password"
                           placeholder="••••••••" autocomplete="new-password" required>
                    <button class="auth-eye" type="button" data-target="password2" aria-label="Показать пароль">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A18.5 18.5 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 4-.94"/><path d="m2 2 20 20"/>
                        </svg>
                    </button>
                </div>
                <div class="auth-alert auth-alert-error" id="pw-mismatch" style="display:none;margin-top:6px;">Пароли не совпадают</div>
            </div>

            <button class="auth-btn auth-btn-primary" type="submit">Зарегистрироваться</button>
        </form>

        <div class="auth-foot">
            Уже есть аккаунт? <a href="/login-page">Войти</a>
        </div>
    </div>
</div>

<script src="/static/js/theme.js"></script>
<script>
    document.querySelectorAll('.auth-eye').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.target);
            if (!input) return;
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.classList.toggle('is-visible', show);
        });
    });

    // Клиентская проверка совпадения паролей
    const form = document.getElementById('register-form');
    const pw   = document.getElementById('password');
    const pw2  = document.getElementById('password2');
    const warn = document.getElementById('pw-mismatch');
    form.addEventListener('submit', (e) => {
        if (pw.value !== pw2.value) {
            e.preventDefault();
            warn.style.display = 'block';
            pw2.focus();
        }
    });
    pw2.addEventListener('input', () => { warn.style.display = 'none'; });
</script>
</body>
</html>
