# Релиз для модалки «Что нового». Как выкатывать: chats_service/docs/releases.md
# Медиа лежат не в git, а в releases/media/v1.0.8/ на хосте.
version: v1.0.8
date: 2026-11-23
title: Панель вложений, превью документов и обновленные шаги агента
body: |
  - Панель вложений чата: медиа, файлы и ссылки с учётом веток
  - Строка контекста и граф шагов агента
  - Черновики остаются в своём чате
items:
  - kind: new
    title: Панель вложений
    body: >
      Все медиа, файлы и ссылки чата в одном месте, с учётом ветления внутри диалога.
      Правый клик может привести к сообщению, где файл появился.
    media: attachments.mp4
  - kind: improve
    title: Новое превью PDF и HTML
    body: >
      PDF открывается с миниатюрами страниц, зумом и пролистыванием.
      Предусмотрен режим разворота на всю ширину. HTML можно смотреть как страницу
      или как код.
    media: preview.mp4
  - kind: improve
    title: Обновление карточек файлов в ответе
    body: >
      Файлы агента идут одним рядом: тип, имя и размер, скачивание по наведению.
  - kind: improve
    title: Новое отображение шагов агента
    body: >
      Теперь шаги в виде git-веток. Видно какие инструменты вызывались, параллельно ли
      и сколько времени занял конретный шаг. Подсвечиваются ошибки инструментов. Отлеживать качество работы агента
      можно нагляднее.
  - kind: new
    title: Вложения общего чата
    body: Медиа, файлы и ссылки группового чата с фильтром «Я / Остальные».
  - kind: new
    title: Замена кнопки
    body: Кнопка «Руководство» с информацией о приложении замена на кнопку «Медиа и Файлы» и вынесена в раздел «Профиль».
  - kind: new
    title: Новое окно для показа обновлений.
    body: Теперь в окно встраиваются медиа-файлы. Вернуться к информации об обновлнениях можно из раздела «Профиль».
  - kind: fix
    title: Строка статуса больше не наезжает на открытую панель
  - kind: fix
    title: Превью картинок грузятся быстрее и сразу показывают размытую заглушку
  - kind: fix
    title: Шапки профиля, сайдбара и чата одной высоты
  
