<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuGent · Редактор</title>
<link rel="stylesheet" href="/static/css/editor.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body data-chat-id="{{ chat_id }}">
  <div class="ed-topbar">
    <div class="ed-brand">AuGent · Редактор</div>
    <div class="ed-ws">
      <label>Область:</label>
      <select id="ed-ws-select"></select>
      <button id="ed-refresh" title="Обновить дерево">⟳</button>
    </div>
    <div class="ed-filename" id="ed-filename"></div>
    <div class="ed-actions">
      <button id="ed-save" title="Сохранить (Ctrl+S)" disabled>Сохранить</button>
    </div>
  </div>
  <div class="ed-main">
    <aside class="ed-tree" id="ed-tree"></aside>
    <section class="ed-editor" id="ed-editor"></section>
    <aside class="ed-ai" id="ed-ai">
      <div class="ed-ai-head">AI-ассистент</div>
      <div class="ed-ai-log chat-main-inner chat-active" id="ed-ai-log"></div>
      <div class="message-input-container ed-ai-input">
        <textarea id="ed-ai-text" placeholder="Спросить агента по открытому файлу..."></textarea>
        <button id="ed-ai-send" title="Отправить (Ctrl+Enter)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/static/js/editor.js"></script>
</body>
</html>
