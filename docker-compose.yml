services:
  broker:
    image: apache/kafka:4.1.0
    container_name: broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

    # LLM Model сервис
  llm_model:
    build: ./llm_model
    container_name: llm_model_service
    ports:
      - "9001:9001"
    depends_on:
      - broker
    environment:
      - PORT_LLM_CONSUMER=9001
      - KAFKA_BROKER=broker:9092
      - API_GIGACHAT=${API_GIGACHAT:-your_api_key_here}  # Можно передать из .env корневой папки
    # volumes:
    #   - ./llm_model:/app  # Раскомментируйте для разработки (hot-reload)
    restart: unless-stopped

  gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "7000:7000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_CRB_SERVICE: ${PORT_CRB_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
#    depends_on:
#      - auth_service
#      - chats_service
#      - llm_model
#      - crb_service
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
        PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
        SECRET_KEY: ${SECRET_KEY}
        ALGORITHM: ${ALGORITHM}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
      image: postgres:15
      container_name: postgres
      environment:
        POSTGRES_DB: ${DB_NAME}           # Особенность Postgres
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5433:5432"
