  gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "7000:7000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
        PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
        SECRET_KEY: ${SECRET_KEY}
        ALGORITHM: ${ALGORITHM}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

  # postgres_old:
  #     image: postgres:15
