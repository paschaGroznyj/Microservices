services:
  broker:
    image: apache/kafka:4.1.0
    container_name: broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

    # LLM Model сервис
#  llm_model_service:
#    build: ./llm_model
#    container_name: llm_model_service
#    ports:
#      - "9001:9001"
#    depends_on:
#      - broker
#    environment:
#      PORT_LLM_CONSUMER: ${PORT_LLM_CONSUMER}
#      KAFKA_BROKER: ${KAFKA_BROKER}
#      API_GIGACHAT: ${API_GIGACHAT}
#
#      HF_HOME: /app/.cache/huggingface
#
#      HF_DATASETS_OFFLINE: "1"
#      TRANSFORMERS_OFFLINE: "1"
#    volumes:
#      - ./models:/app/.cache/huggingface/hub
#    restart: unless-stopped

  agent_service:
    build: ./agent_service
    container_name: agent_service
    ports:
      - "9001:9001"
    depends_on:
      - broker
    environment:
      PORT_LLM_CONSUMER: ${PORT_LLM_CONSUMER}
      KAFKA_BROKER: ${KAFKA_BROKER}
      API_GIGACHAT: ${API_GIGACHAT}

      GIGACHAT_AUTHORIZATION: ${GIGACHAT_AUTHORIZATION}
      STORAGE_PATH: ${STORAGE_PATH}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      ARTICLES_FOLDER: ${ARTICLES_FOLDER}
      METADATA_FOLDER: ${METADATA_FOLDER}
      FAISS_FOLDER: ${FAISS_FOLDER}
      DIGESTS_FOLDER: ${DIGESTS_FOLDER}

      OBS_BUCKET: ${OBS_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}

      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /app/.cache/huggingface

#      HF_DATASETS_OFFLINE: "0"
#     TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./models:/app/.cache/huggingface/hub
    restart: unless-stopped

  parsers_service:
    build: ./parsers_service
    container_name: parsers_service
    ports:
      - "8003:8003"
    environment:
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}

      STORAGE_PATH: ${STORAGE_PATH}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      SYNC_INTERVAL_SCHEDULER: ${SYNC_INTERVAL_SCHEDULER}
      ARTICLES_FOLDER: ${ARTICLES_FOLDER}
      METADATA_FOLDER: ${METADATA_FOLDER}

      OBS_BUCKET: ${OBS_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
    restart: unless-stopped

  gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "7000:7000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_CRB_SERVICE: ${PORT_CRB_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      PORT_LLM_CONSUMER: ${PORT_LLM_CONSUMER}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
#    depends_on:
#      - auth_service
#      - chats_service
#      - llm_model
#      - crb_service
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
        PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
        SECRET_KEY: ${SECRET_KEY}
        ALGORITHM: ${ALGORITHM}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
      image: postgres:15
      container_name: postgres
      environment:
        POSTGRES_DB: ${DB_NAME}           # Особенность Postgres
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5433:5432"
  
  chromadb:
    image: chromadb/chroma
    container_name: chromadb
  
  rag_service:
    container_name: rag_service
    build: ./rag_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8000:8002"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      EMB_MODEL: ${EMB_MODEL}
      GC_KEY: ${GC_KEY}
    depends_on:
      - chromadb
  
  chats_service:
    container_name: chats_service
    build: ./chats_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker

  chats-consumer:
    container_name: chats-consumer
    build: ./chats_service
    command: python -m app.endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker
    restart: unless-stopped

  # Парсер — batch job, запуск: docker-compose run parser_service
  parser_service:
    build:
      context: ./agent_service
      dockerfile: Dockerfile.parser
    container_name: parser_service
    environment:
      DATE_RANGE_START: ${DATE_RANGE_START:-2026-01-01}
      DATE_RANGE_END: ${DATE_RANGE_END:-2026-01-30}
      STORAGE_PATH: /app/knowledge_base
      ARTICLES_FOLDER: articles
      METADATA_FILE: metadata.json
      LOG_LEVEL: INFO
      SCHOLAR_MAX_PAGES: ${SCHOLAR_MAX_PAGES:-2}
      MISTRAL_KEY: ${MISTRAL_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
    volumes:
      - parser_data:/app/knowledge_base
      - parser_logs:/app/logs

volumes:
  kafka-data:
  llm_cache:
  parser_data:
  parser_logs:

