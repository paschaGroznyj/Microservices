# Релиз для модалки «Что нового». Как выкатывать: chats_service/docs/releases.md
# Медиа лежат не в git, а в releases/media/v1.0.7/ на хосте.
version: v1.0.7
date: 2026-11-20
title: Память чата под полем ввода, ветки чата и уровни
body: |
  - Строка памяти под полем ввода: журнал, саммари, контекст и шаги
  - Ветка чата от любого ответа агента
  - Рассуждения GPT видны во время ответа
  - Уровни пользователя в профиле
  - Сайдбар: две строки на чат, счётчики, статус «Агент работает»
  - Просмотр Jupyter Notebook в превью
items:
  - kind: new
    title: Память чата под полем ввода
    body: >
      Под полем ввода видно, что помнит агент: записи журнала, покрытие истории
      саммари, размер контекста с долей кэша и число шагов в последнем ответе.
      Клик открывает карточку с подробностями, во вкладке «Шаги» видны модель
      и все вызовы инструментов.
    media: input_zoom.mp4
  - kind: new
    title: Ветка от ответа агента
    body: >
      Чат можно ответвить от любого ответа агента и попробовать другой путь.
      Ветка видит историю родителя, его файлы, картинки, реакции и ответы на опросы.
      Ветвление необходимо для начала работы с несколькими задачами на контексте одного диалога.
    media: button_branch.png
  - kind: improve
    title: Рассуждения GPT
    body: >
      GPT показывает ход рассуждений прямо во время ответа, в том числе
      когда работает с инструментами.
  - kind: new
    title: Уровни пользователя
    body: >
      Бейдж у аватара показывает уровень по числу запросов к агенту:
      от «Новичка» до «Легенды». В профиле видно, сколько осталось до следующего.
    media: levels_zoom.mp4
  - kind: improve
    title: Сайдбар
    body: >
      В списке чатов теперь заголовок, последнее сообщение и время. Чаты подгружаются
      постранично, у секций есть счётчики, а у чата, где работает агент,
      стоит статус «Агент работает». В профиле ваше имя и инициалы.
    media: new_form_ava_1.0.7.png
  - kind: new
    title: Jupyter Notebook в превью
    body: Файлы .ipynb открываются в превью с ячейками кода, markdown и выводами.
  - kind: fix
    title: Агент точнее считает токены под выбранную модель и реже обрезает историю
  - kind: fix
    title: Отмена задачи закрывает карточку, даже если песочница перезапускалась
  - kind: fix
    title: Пункты меню чата подсвечиваются при наведении в тёмной теме