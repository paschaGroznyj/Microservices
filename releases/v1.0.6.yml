version: v1.0.6
date: 2026-11-17
title: Правка файлов в превью и расход ресурсов за ход
body: |
  - Режим правки и поиск по файлу в панели превью
  - Карточка «Использование ресурсов за ход» у ответа агента
  - Текстовые файлы агента открываются в превью
  - Обновлённый левый сайдбар
items:
  - kind: new
    title: Правка и поиск в превью файла
    body: >
      Строки файла можно править, удалять и комментировать прямо в панели превью,
      а затем отправить правки агенту одним запросом. Поиск по файлу открывается
      по Ctrl+F (Cmd+F), Enter и Shift+Enter листают совпадения.
    media: search_button.png
  - kind: new
    title: Расход ресурсов за ход
    body: >
      У ответа агента появился чип с суммой токенов. Он открывает карточку:
      семейство модели, попадание в кэш и токены, которые пришлось считать заново.
    media: tokens_button.png
  - kind: improve
    title: Файлы агента открываются в превью
    body: Текстовые файлы из ответа агента открываются в панели превью, а не скачиваются.
  - kind: improve
    title: Обновлённый сайдбар
    body: Тонкие линии и рамки, шрифт 13 px и ровные отступы в левом сайдбаре.
  - kind: fix
    title: В Sigma вставленный длинный текст уходит агенту файлом
