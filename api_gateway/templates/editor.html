<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuGent · Редактор</title>
<link rel="icon" type="image/png" href="/static/img/editor_icon.png">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")}catch(_){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/tools-panel.css">
<link rel="stylesheet" href="/static/css/presence.css">
<link rel="stylesheet" href="/static/css/editor.css">
<link rel="stylesheet" href="/static/css/generative-ui.css">
<script src="/static/js/palette.js"></script>
<script src="/static/js/vendor/marked.min.js"></script>
<script src="/static/js/vendor/purify.min.js"></script>
<link rel="stylesheet" href="/static/js/vendor/github.min.css" id="hljs-theme-light">
<link rel="stylesheet" href="/static/js/vendor/github-dark.min.css" id="hljs-theme-dark" disabled>
<script src="/static/js/vendor/highlight.min.js"></script>
</head>
<body data-chat-id="{{ chat_id }}" data-workspace-id="{{ workspace_id }}">
  <div class="chat-layout ed-layout" id="ed-layout">

    <div class="ed-mobile-overlay" id="ed-mobile-overlay" aria-hidden="true"></div>

    <!-- ══════════════════════════════
         LEFT SIDEBAR (Файлы области)
    ══════════════════════════════ -->
    <aside class="sidebar ed-sidebar" id="ed-sidebar">
      <div class="sidebar-header">
        <a href="/" class="brand-link" title="AuGent Редактор">
          <img class="brand-icon brand-icon-img js-theme-icon" src="/static/img/sage_black.png" data-icon-light="/static/img/sage_black.png" data-icon-dark="/static/img/sage_white.png" alt="AuGent">
          <span class="brand-name">Редактор</span>
        </a>
        <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Свернуть панель" aria-expanded="true" title="Свернуть панель">
          <svg class="sidebar-collapse-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.25" stroke="currentColor" stroke-width="1.4"></rect><line x1="8" y1="3.75" x2="8" y2="16.25" stroke="currentColor" stroke-width="1.4"></line></svg>
        </button>
      </div>
      <div class="sidebar-section ed-tree" id="ed-tree"></div>
    </aside>

    <!-- ══════════════════════════════
         CENTER (Topbar + Monaco Editor)
    ══════════════════════════════ -->
    <main class="chat-main ed-center">
      <header class="main-header ed-topbar">
        <button type="button" class="sidebar-collapse-btn ed-expand-left" id="sidebar-expand-btn" aria-label="Развернуть панель файлов" aria-expanded="false" title="Развернуть панель файлов">
          <svg class="sidebar-collapse-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h3l1.5 1.75h6.5A1.5 1.5 0 0 1 17 7.25v7.25A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>

        <div class="ed-ws" id="ed-ws">
          <span class="ed-live" id="ed-live" data-state="off" role="button" tabindex="0" title="Live-синхронизация выключена" aria-label="Статус синхронизации файлов"></span>
          <div class="ed-ws-pick">
            <select id="ed-ws-select" class="ed-ws-select" aria-label="Рабочая область"></select>
            <svg class="ed-ws-chev" viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="ed-ttl" id="ed-ttl" hidden>
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.8V8l2.2 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span class="ed-ttl-text" id="ed-ttl-text">—</span>
          </span>
        </div>

        <div class="main-title ed-filename" id="ed-filename"></div>

        <div class="header-actions ed-actions">
          <button type="button" id="ed-preview-toggle" class="ed-icon-btn" title="Превью (Ctrl+Shift+V)" aria-label="Превью" aria-pressed="false" hidden>
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button class="theme-toggle ed-theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button type="button" id="ed-save" class="ed-header-btn" title="Сохранить (Ctrl+S)" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" aria-hidden="true">
              <path d="M4 10.5l4 4L16 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Сохранить</span>
          </button>
          <button type="button" class="ed-agent-toggle ed-expand-right" id="ai-expand-btn" aria-label="Открыть панель агента" aria-expanded="false" title="Агент (Ctrl+Shift+A)">
            <svg class="sidebar-collapse-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M4 4.75h12a1.25 1.25 0 0 1 1.25 1.25v7a1.25 1.25 0 0 1-1.25 1.25H9l-3.5 2.5v-2.5H4A1.25 1.25 0 0 1 2.75 13V6A1.25 1.25 0 0 1 4 4.75z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 7.2l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z" fill="currentColor"/></svg>
            <span>Агент</span>
          </button>
        </div>
      </header>

        <div class="ed-disk-banner" id="ed-disk-banner" role="status" hidden>
          <span class="ed-disk-text" id="ed-disk-text"></span>
          <button type="button" class="ed-disk-btn" id="ed-disk-reload">Загрузить с диска</button>
          <button type="button" class="ed-disk-btn" id="ed-disk-keep">Оставить мою версию</button>
        </div>
      <div class="ed-workarea" id="ed-workarea">
        <section class="ed-editor" id="ed-editor"></section>
        <section class="ed-preview" id="ed-preview" hidden aria-label="Превью файла"></section>
      </div>
    </main>

    <!-- ══════════════════════════════
         RESIZER + RIGHT SIDEBAR (Агент)
    ══════════════════════════════ -->
    <div class="ed-ai-resizer" id="ed-ai-resizer" role="separator" aria-orientation="vertical" title="Потяните, чтобы изменить ширину панели"></div>

    <aside class="ed-ai chat-main-inner chat-active" id="ed-ai">
      <div class="main-header ed-ai-head">
        <div class="main-title ed-ai-title">Агент</div>
        <div class="header-actions">
          <button type="button" class="sidebar-collapse-btn" id="ai-collapse-btn" aria-label="Закрыть панель агента" aria-expanded="true" title="Закрыть панель агента">
            <svg class="sidebar-collapse-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="ed-ai-log chat-messages" id="ed-ai-log"></div>
      <div class="message-input-container ed-ai-input">
        <div class="chat-input-area">
          <div class="chat-input-box" id="ed-ai-input-box">
            <textarea id="ed-ai-text" class="chat-input-field" placeholder="Спросить агента по открытому файлу…  / — команды" rows="1"></textarea>
            <div class="chat-input-footer ed-ai-footer">
              <span class="attach-btn ed-ai-attach-anchor" style="display:none"></span>
              <!-- ToolsPanel.inject() + ModelPicker.inject() вставят сюда кнопки 🔧 и выбор модели -->
              <button id="ed-ai-send" class="chat-send-btn" title="Отправить (Enter, перенос строки Shift+Enter)" aria-label="Отправить">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </aside>

  </div>
  <script src="/static/js/vendor/monaco/vs/loader.js"></script>
  <script src="/static/js/theme.js"></script>
  <script type="module" src="/static/js/tools-panel.js"></script>
  <script src="/static/js/generative-ui.js"></script>
  <script type="module" src="/static/js/editor.js"></script>
  <script src="/static/js/presence.js"></script>
</body>
</html>
