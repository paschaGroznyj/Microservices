  #       POSTGRES_USER: ${DB_USER}
  #       POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     ports:
  #       - "5433:5432"
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      # Настройки PostgreSQL для производительности и автоочистки
      command: >
        postgres
        -c autovacuum=on
        -c max_connections=300
        -c autovacuum_vacuum_scale_factor=0.1
        -c autovacuum_vacuum_threshold=1000
        -c min_wal_size=500MB
        -c max_wal_size=2GB
        -c wal_keep_size=0
        -c checkpoint_timeout=15min
        -c log_min_duration_statement=1000
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups

    logging:
      # Ограничение размера логов, чтобы контейнер не раздувало
      driver: "json-file"
      options:
        max-size: "10m"      # Каждый файл лога максимум 10MB
        max-file: "3"         # Хранить не больше 3 файлов
        compress: "true"      # Сжимать старые логи

