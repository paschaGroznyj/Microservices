<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рендер ответа от AI</title>

    <!-- Подключаем библиотеку marked для конвертации MD в HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Контейнер сообщения (пузырь чата) */
        .chat-message {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 20px;
            margin: 20px;
            line-height: 1.6;
            color: #333;
        }

        /* Стили внутри Markdown контента */
        .chat-message h1, .chat-message h2, .chat-message h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        /* Стиль для разделителя --- */
        .chat-message hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }

        /* Стиль для жирного текста (заголовки результатов) */
        .chat-message strong {
            color: #2980b9; /* Синий цвет для заголовков */
        }

        /* Стиль для фрагмента текста */
        .chat-message p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Сюда будем вставлять результат -->
    <div id="message-container" class="chat-message">
        Загрузка...
    </div>

    <script>
        // 1. Эмуляция данных, которые вернул твой Python-скрипт
        const mockApiResponse = {
            "status": "success",
            "count": 2,
            "preview": [],
            // Это то самое поле message с Markdown разметкой
            "message": "Найдено 2 релевантных фрагментов по запросу:\n\n**Результат 1** (релевантность: 0.854)\n**Фрагмент**: Искусственный интеллект — это свойство автоматических систем брать на себя отдельные функции человеческого интеллекта, например, выбирать и принимать оптимальные решения на основе ранее полученного опыта и рационального внешнего воздействия.\n\n---\n\n**Результат 2** (релевантность: 0.721)\n**Фрагмент**: Машинное обучение — это обширный подраздел искусственного интеллекта, изучающий методы построения алгоритмов, способных обучаться."
        };

        // 2. Функция рендера
        function renderMessage(data) {
            const container = document.getElementById('message-container');

            if (data.status !== 'success') {
                container.innerHTML = "Ошибка получения данных.";
                return;
            }

            // Превращаем Markdown строку в HTML
            // marked.parse() делает всю магию
            const htmlContent = marked.parse(data.message);

            // Вставляем в DOM
            container.innerHTML = htmlContent;
        }

        // 3. Запускаем
        renderMessage(mockApiResponse);

    </script>
</body>
</html>
