    max_tokens: 64000
    reasoning:
      type: "adaptive"
      display: "summarized"
    chars_per_token: 1.3
    imitate_tool_status: false
    tool_name_integrity_guidance: false
    vision_target: "designer"
    legacy_builder: "get_llm_model_claude"
    hint: "Модель от Anthropic. Сильна в коде, генерирует презентации и отчёты. Показывает reasoning (размышления)."
