<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добро пожаловать - Chat App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ea66e8 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 { font-size: 3rem; margin-bottom: 1rem; }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-ghost {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(8px);
            font-size: 0.95rem;
        }

        .divider {
            margin: 1.5rem 0 0.5rem;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            color: #333;
            text-align: left;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #222;
        }

        .modal-warning {
            background: #fff8e1;
            border-left: 4px solid #f59e0b;
            border-radius: 0 8px 8px 0;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-warning p {
            font-size: 0.95rem;
            color: #78350f;
            line-height: 1.5;
        }

        .modal-warning p + p {
            margin-top: 0.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            flex-direction: column;
        }

        .btn-confirm {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #ea66e8 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-confirm:hover { opacity: 0.9; }

        .btn-confirm:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-cancel {
            width: 100%;
            padding: 0.85rem;
            background: #f1f5f9;
            color: #555;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancel:hover { background: #e2e8f0; }

        /* скрытая форма для POST */
        #guest-form { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Чат Приложение</h1>
        <p class="subtitle">Общайтесь с Агентом по PM</p>

        <div class="buttons">
            <a href="/login-page" class="btn btn-primary">🔐 Войти</a>
            <a href="/register-page" class="btn btn-secondary">📝 Регистрация</a>
        </div>

        <div class="divider">или</div>

        <div class="buttons">
            <button class="btn btn-ghost" onclick="openGuestModal()">
                👤 Войти без регистрации
            </button>
        </div>
    </div>

    <!-- Модалка предупреждения -->
    <div class="modal-overlay" id="guestModal" onclick="handleOverlayClick(event)">
        <div class="modal">
            <span class="modal-icon">👤</span>
            <h2>Войти как гость?</h2>

            <div class="modal-warning">
                <p>⚠️ История чатов сохранится <strong>только в рамках текущей сессии</strong>.</p>
                <p>После выхода или закрытия браузера все сообщения будут недоступны — аккаунт гостя не восстанавливается.</p>
            </div>

            <div class="modal-actions">
                <button class="btn-confirm" id="confirmBtn" onclick="confirmGuest()">
                    Всё понятно, продолжить
                </button>
                <button class="btn-cancel" onclick="closeGuestModal()">
                    Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- POST-форма для гостевого входа -->
    <form id="guest-form" method="post" action="/without-register-web"></form>

    <script>
        function openGuestModal() {
            document.getElementById('guestModal').classList.add('active');
        }

        function closeGuestModal() {
            document.getElementById('guestModal').classList.remove('active');
        }

        function handleOverlayClick(e) {
            // Закрываем только при клике на оверлей, не на саму модалку
            if (e.target === e.currentTarget) closeGuestModal();
        }

        function confirmGuest() {
            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.textContent = 'Входим...';
            document.getElementById('guest-form').submit();
        }

        // Закрытие по Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeGuestModal();
        });
    </script>
</body>
</html>
