# Релиз для модалки «Что нового». Как выкатывать: chats_service/docs/releases.md
# Медиа лежат не в git, а в releases/media/v1.0.8/ на хосте.
version: v1.0.8
date: 2026-11-22
title: Панель вложений, шаги агента и черновики
# body — запасной текст (markdown) для старых клиентов и поиска по истории.
body: |
  - Панель вложений чата: медиа, файлы и ссылки с учётом веток
  - Строка контекста и граф шагов агента
  - Черновики остаются в своём чате
items:
  - kind: new
    title: Панель вложений
    body: >
      Все медиа, файлы и ссылки чата в одном месте, с учётом веток.
      Правый клик ведёт к сообщению, где файл появился.
    media: attachments.webm
  - kind: improve
    title: Контекст и шаги агента
    body: >
      Строка под полем ввода показывает, сколько контекста занято,
      и раскрывает граф шагов: какие инструменты вызывались, параллельно ли
      и сколько это заняло.
    media: steps.webm
  - kind: new
    title: Черновики по чатам
    body: >
      Текст и вложенные файлы остаются в том чате, где вы их начали.
      Можно переключиться и вернуться.
    media: drafts.webp
  - kind: new
    title: Вложения общего чата
    body: Медиа, файлы и ссылки группового чата с фильтром «Я / Остальные».
  - kind: fix
    title: Строка статуса больше не наезжает на открытую панель
  - kind: fix
    title: Превью картинок грузятся быстрее и сразу показывают размытую заглушку
  - kind: fix
    title: Шапки профиля, сайдбара и чата одной высоты
  - kind: fix
    title: Точка ответвления ветки нарисована без разрывов
