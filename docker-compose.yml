  chats_service:
    container_name: chats_service
    build: ./chats_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker
    restart: unless-stopped

  chats-consumer:
    container_name: chats-consumer
    build: ./chats_service
    command: python -m app.endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
