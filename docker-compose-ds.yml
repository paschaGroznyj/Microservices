services:
  broker:
    image: apache/kafka:4.1.0
    container_name: broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  agent_ds:
    build: ./agent_ds
    container_name: agent_ds
    ports:
      - "1001:1001"
    depends_on:
      - broker
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      PORT_DS_AGENT: ${PORT_DS_AGENT}
      KAFKA_BROKER: ${KAFKA_BROKER}

    restart: unless-stopped

  gateway_ds:
    build: ./api_gateway_ds
    container_name: api_gateway_ds
    ports:
      - "1000:1000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT_DS}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      # Настройки PostgreSQL для производительности и автоочистки
      command: >
        postgres
        -c autovacuum=on
        -c max_connections=300
        -c autovacuum_vacuum_scale_factor=0.1
        -c autovacuum_vacuum_threshold=1000
        -c min_wal_size=500MB
        -c max_wal_size=2GB
        -c wal_keep_size=0
        -c checkpoint_timeout=15min
        -c log_min_duration_statement=1000
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

    logging:
      # Ограничение размера логов, чтобы контейнер не раздувало
      driver: "json-file"
      options:
        max-size: "10m"      # Каждый файл лога максимум 10MB
        max-file: "3"         # Хранить не больше 3 файлов
        compress: "true"      # Сжимать старые логи

  neo4j:
    image: neo4j:5.15-community
    container_name: my_neo4j_graph
    mem_limit: 1200m
    memswap_limit: 1200m
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256M 
      - NEO4J_dbms_memory_heap_max__size=512M    
      - NEO4J_dbms_memory_pagecache_size=256M      
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j_data/data:/data
    restart: unless-stopped

  chats_service:
    container_name: chats_service
    build: ./chats_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker

  chats-consumer:
    container_name: chats-consumer
    build: ./chats_service
    command: python -m app.endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker
    restart: unless-stopped

volumes:
  kafka-data:
  llm_cache:
  postgres_data:
  neo4j_data: