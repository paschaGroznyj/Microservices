<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AuGent — мы переехали</title>
<meta name="description" content="CatchPM теперь AuGent. Новый адрес: augent.cds.uva-advanced.ru"/>
<style>
:root{
  --accent:#6366f1;
  --sidebar-bg:#eef1f8;
  --text-primary:#1e2433;
  --text-secondary:#5a6478;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--sidebar-bg);
  color:var(--text-primary);
  overflow:hidden;
}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;background:var(--sidebar-bg);}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1s ease;}
.screen.bg-ready .bg{opacity:1;}
#graph{position:absolute;inset:0;display:block;width:100%;height:100%;will-change:transform;}
.card{
  position:relative;z-index:2;width:100%;max-width:560px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;
  padding:44px 40px 40px;border-radius:24px;
  background:rgba(255,255,255,0.32);
  border:1px solid rgba(255,255,255,0.42);
  box-shadow:0 18px 48px rgba(15,23,42,0.14),inset 0 1px 0 rgba(255,255,255,0.45);
  backdrop-filter:blur(7px) saturate(118%);
  -webkit-backdrop-filter:blur(7px) saturate(118%);
}
.brand{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1;}
.brand em{font-style:normal;color:var(--accent);}
.badge{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:rgba(99,102,241,.12);padding:5px 12px;border-radius:999px;}
.lead{font-size:1.12rem;line-height:1.55;color:var(--text-primary);}
.lead b{color:var(--accent);}
.sub{font-size:.95rem;color:var(--text-secondary);line-height:1.5;}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:4px;padding:15px 30px;border-radius:14px;
  font-size:1.05rem;font-weight:700;text-decoration:none;
  color:#fff;background:var(--accent);
  box-shadow:0 10px 26px rgba(99,102,241,.4);
  transition:transform .18s ease,box-shadow .18s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(99,102,241,.5);}
.cta svg{width:18px;height:18px;}
.newlink{font-size:.9rem;color:var(--text-secondary);word-break:break-all;}
.newlink a{color:var(--accent);text-decoration:none;font-weight:600;}
.newlink a:hover{text-decoration:underline;}
@media (max-width:520px){.card{padding:34px 24px 30px;gap:18px}.brand{font-size:2.1rem}.lead{font-size:1rem}}
@media (prefers-color-scheme:dark){
  :root{--sidebar-bg:#0f1725;--text-primary:#e6eaf2;--text-secondary:#9aa5bd;}
  .card{background:rgba(15,23,37,0.4);border-color:rgba(255,255,255,0.14);box-shadow:0 18px 48px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);}
  .badge{background:rgba(99,102,241,.2);}
}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="bg" aria-hidden="true"><canvas id="graph"></canvas></div>
  <main class="card">
    <span class="badge">Мы переехали</span>
    <h1 class="brand">Au<em>Gent</em></h1>
    <p class="lead">Платформа <b>CatchPM</b> теперь называется <b>AuGent</b> и переехала на новый адрес.</p>
    <p class="sub">Все ваши данные, чаты и настройки на месте — просто откройте платформу по новой ссылке и обновите закладку.</p>
    <a class="cta" href="https://augent.cds.uva-advanced.ru/">Перейти на AuGent
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="newlink">Новый адрес: <a href="https://augent.cds.uva-advanced.ru/">augent.cds.uva-advanced.ru</a></p>
  </main>
</div>
<script>
(function(){
  var screen=document.getElementById('screen');
  var cv=document.getElementById('graph');
  if(!screen||!cv)return;
  requestAnimationFrame(function(){screen.classList.add('bg-ready');});
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CONFIG={nodes:64,linkDist:132,cursorRadius:150,cursorForce:0.9,glowRadius:180,cursorLerp:0.12};
  var g=cv.getContext('2d');
  var root=document.documentElement;
  var W=0,H=0,dpr=1,nodes=[];
  var m={x:0,y:0,sx:0,sy:0,active:false,seeded:false};
  function parseAccent(){
    var cs=getComputedStyle(root);
    var v=(cs.getPropertyValue('--accent').trim())||'#6366f1';
    var r,gg,b;
    if(v[0]==='#'){if(v.length===4)v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
      r=parseInt(v.slice(1,3),16);gg=parseInt(v.slice(3,5),16);b=parseInt(v.slice(5,7),16);}
    else{var mm=v.match(/\d+/g)||[99,102,241];r=+mm[0];gg=+mm[1];b=+mm[2];}
    var clamp=function(x){return Math.max(0,Math.min(255,Math.round(x)));};
    var shade=function(k){return clamp(r*k)+','+clamp(gg*k)+','+clamp(b*k);};
    return [r+','+gg+','+b,shade(1.18),shade(0.82)];
  }
  var COLS=parseAccent();
  function resize(){
    var rct=screen.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,rct.width);H=Math.max(1,rct.height);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
    g.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(CONFIG.nodes*Math.min(1,(W*H)/(1440*900))+16);
    nodes=[];for(var i=0;i<n;i++){nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:1.5+Math.random()*2.3,c:COLS[i%3]});}
  }
  var seed=function(){if(!m.seeded){m.sx=m.x;m.sy=m.y;m.seeded=true;}};
  window.addEventListener('mousemove',function(e){m.x=e.clientX;m.y=e.clientY;m.active=true;seed();});
  window.addEventListener('mouseleave',function(){m.active=false;});
  window.addEventListener('touchmove',function(e){var t=e.touches&&e.touches[0];if(!t)return;m.x=t.clientX;m.y=t.clientY;m.active=true;seed();},{passive:true});
  window.addEventListener('touchend',function(){m.active=false;});
  window.addEventListener('resize',resize);
  resize();
  function drawGraph(){
    g.clearRect(0,0,W,H);
    var L=CONFIG.linkDist,RR=CONFIG.cursorRadius,GR=CONFIG.glowRadius;
    var rct=screen.getBoundingClientRect();
    var cx=m.sx-rct.left,cy=m.sy-rct.top;
    var live=m.active;
    var vk=reduce?0.35:1;
    for(var k=0;k<nodes.length;k++){var n=nodes[k];
      n.x+=n.vx*vk;n.y+=n.vy*vk;
      if(n.x<-20)n.x=W+20;if(n.x>W+20)n.x=-20;if(n.y<-20)n.y=H+20;if(n.y>H+20)n.y=-20;
      if(live){var dx=n.x-cx,dy=n.y-cy,dist=Math.hypot(dx,dy);
        if(dist<RR&&dist>0.1){var f=(1-dist/RR)*CONFIG.cursorForce;n.x+=(dx/dist)*f;n.y+=(dy/dist)*f;}}}
    for(var i=0;i<nodes.length;i++){var a=nodes[i];
      for(var j=i+1;j<nodes.length;j++){var b=nodes[j];
        var d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<L){var near=live?Math.max(0,1-Math.hypot((a.x+b.x)/2-cx,(a.y+b.y)/2-cy)/GR):0;
          var alpha=(1-d/L)*(.26+near*.5);
          g.strokeStyle='rgba('+a.c+', '+alpha+')';g.lineWidth=1+near*.8;
          g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}}}
    for(var p=0;p<nodes.length;p++){var nn=nodes[p];
      var near2=live?Math.max(0,1-Math.hypot(nn.x-cx,nn.y-cy)/GR):0;
      g.fillStyle='rgba('+nn.c+', '+(.55+near2*.45)+')';
      g.beginPath();g.arc(nn.x,nn.y,nn.r+near2*1.5,0,Math.PI*2);g.fill();}
  }
  var frames=0;
  function frame(){
    if(m.seeded){m.sx+=(m.x-m.sx)*CONFIG.cursorLerp;m.sy+=(m.y-m.sy)*CONFIG.cursorLerp;}
    if((frames++&63)===0){COLS=parseAccent();for(var i=0;i<nodes.length;i++)nodes[i].c=COLS[i%3];}
    drawGraph();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
