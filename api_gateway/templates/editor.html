<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор — AuGent</title>
<link rel="icon" href="/static/img/sage_black.png">
<style>
  :root{
    --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d30; --border:#333;
    --text:#ccc; --muted:#858585; --accent:#0e639c; --accent2:#1177bb;
    --hover:#2a2d2e; --active:#094771;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  .topbar{height:40px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:12px;flex:0 0 40px}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .topbar .brand img{width:18px;height:18px;border-radius:4px}
  .topbar .sp{flex:1}
  .topbar .fname{color:var(--muted);font-size:12px}
  .topbar .dirty{color:#e2c08d}
  .btn{background:var(--accent);color:#fff;border:none;padding:5px 12px;border-radius:4px;font-size:12px;cursor:pointer}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.ghost:hover{background:var(--hover)}
  .main{flex:1;display:flex;min-height:0}
  .sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:0 0 260px}
  .sidebar .shead{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .sidebar .shead .acts{display:flex;gap:4px}
  .iconbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:3px;line-height:1}
  .iconbtn:hover{background:var(--hover);color:var(--text)}
  .tree{flex:1;overflow:auto;padding:4px 0}
  .node{user-select:none}
  .row{display:flex;align-items:center;gap:5px;padding:3px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--active)}
  .row .tw{width:12px;display:inline-block;text-align:center;color:var(--muted);font-size:10px}
  .row .ic{width:14px;text-align:center}
  .children{padding-left:12px}
  .editorwrap{flex:1;min-width:0;position:relative}
  #monaco{position:absolute;inset:0}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-direction:column;gap:8px}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--border);padding:9px 14px;border-radius:6px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .toast.err{border-color:#be4c4c;color:#f0a0a0}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="brand" href="/" style="text-decoration:none;color:inherit">
      <img src="/static/img/sage_black.png" alt=""> Редактор
    </a>
    <span class="fname" id="curFile">файл не выбран</span>
    <span class="sp"></span>
    <button class="btn ghost" id="btnReload" title="Обновить дерево">⟳</button>
    <button class="btn" id="btnSave" disabled>Сохранить (Ctrl+S)</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="shead">
        <span>Воркспейс</span>
        <span class="acts">
          <button class="iconbtn" id="btnNewFile" title="Новый файл">🖹</button>
          <button class="iconbtn" id="btnNewDir" title="Новая папка">🗀</button>
        </span>
      </div>
      <div class="tree" id="tree"></div>
    </div>
    <div class="editorwrap">
      <div id="monaco"></div>
      <div class="empty" id="empty">
        <div style="font-size:32px">🖊</div>
        <div>Выберите файл слева для редактирования</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/static/js/editor.js"></script>
</body>
</html>
