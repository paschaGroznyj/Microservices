  agent_service:
    build: ./agent_service
    container_name: agent_service
    ports:
      - "9001:9001"
    depends_on:
      - broker
    environment:
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      KAFKA_BROKER: ${KAFKA_BROKER}

      STORAGE_PATH: ${STORAGE_PATH}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      ARTICLES_FOLDER: ${ARTICLES_FOLDER}
      METADATA_FOLDER: ${METADATA_FOLDER}
      FAISS_FOLDER: ${FAISS_FOLDER}
      DIGESTS_FOLDER: ${DIGESTS_FOLDER}

      OBS_BUCKET: ${OBS_BUCKET}
      OBS_OPEN_BUCKET: ${OBS_OPEN_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}

      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /app/.cache/huggingface

      HF_DATASETS_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

    volumes:
      - ./models:/app/.cache/huggingface/hub
      - ./agent_service/config:/app/config
    restart: unless-stopped



  # plug_service:
  #   build: ./plug_service
  #   container_name: plug_service
  #   ports:
  #     - "19001:9001"
  #   depends_on:
  #     - broker
  #   environment:
  #     PORT_PLUG_AGENT: ${PORT_PLUG_AGENT}
  #     KAFKA_BROKER: ${KAFKA_BROKER}

  #     REDIS_HOST: ${REDIS_HOST}
  #     REDIS_PORT: ${REDIS_PORT}
  #     REDIS_KEY: ${REDIS_KEY}
  #   restart: unless-stopped


  token_service:
    build: ./token_service
    container_name: token_service
    ports:
      - "9004:9004"
    environment:
      INTERNAL_TOKEN_API_URL: ${INTERNAL_TOKEN_API_URL}
      PORT_TOKEN_GENERATE_SERVICE: ${PORT_TOKEN_GENERATE_SERVICE}
      TOKEN_TTL: ${TOKEN_TTL}
      IAM_API_KEY: ${IAM_API_KEY}

  # selenium_chrome:
  #     image: selenium/standalone-chrome:latest
  #     shm_size: '2gb'
  #     ports:
  #       - "4444:4444"

  parsers_service:
    build: ./parsers_service
    container_name: parsers_service
    ports:
      - "8003:8003"
    environment:
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      STORAGE_PATH: ${STORAGE_PATH}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      SYNC_INTERVAL_SCHEDULER: ${SYNC_INTERVAL_SCHEDULER}
      ARTICLES_FOLDER: ${ARTICLES_FOLDER}
      METADATA_FOLDER: ${METADATA_FOLDER}

      OBS_BUCKET: ${OBS_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
    
    restart: unless-stopped

  gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "7000:7000"
    environment:
      PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      PORT_PM_AGENT: ${PORT_PM_AGENT}
      PORT_PARSERS_SERVICE: ${PORT_PARSERS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    environment:
        PORT_AUTH_SERVICE: ${PORT_AUTH_SERVICE}
        SECRET_KEY: ${SECRET_KEY}
        ALGORITHM: ${ALGORITHM}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

  # postgres_old:
  #     image: postgres:15
  #     container_name: postgres
  #     environment:
  #       POSTGRES_DB: ${DB_NAME}           # Особенность Postgres
  #       POSTGRES_USER: ${DB_USER}
  #       POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     ports:
  #       - "5433:5432"
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      # Настройки PostgreSQL для производительности и автоочистки
      command: >
        postgres
        -c autovacuum=on
        -c max_connections=300
        -c autovacuum_vacuum_scale_factor=0.1
        -c autovacuum_vacuum_threshold=1000
        -c min_wal_size=500MB
        -c max_wal_size=2GB
        -c wal_keep_size=0
        -c checkpoint_timeout=15min
        -c log_min_duration_statement=1000
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

    logging:
      # Ограничение размера логов, чтобы контейнер не раздувало
      driver: "json-file"
      options:
        max-size: "10m"      # Каждый файл лога максимум 10MB
        max-file: "3"         # Хранить не больше 3 файлов
        compress: "true"      # Сжимать старые логи


  # chromadb:
  #   image: chromadb/chroma
  #   container_name: chromadb
  #   ports:
  #     - "9003:8000"


  rag_service:
    container_name: rag_service
    build: ./rag_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      EMB_MODEL: ${EMB_MODEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_KEY: ${REDIS_KEY}
      VDB_TYPE: ${VDB_TYPE}
      GC_AUTH_URL: ${GC_AUTH_URL}
      GC_MODEL: ${GC_MODEL}
      OBS_BUCKET: ${OBS_BUCKET}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY}
      OBS_REGION: ${OBS_REGION}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
    depends_on:
      - postgres
      - token_service
  
  chats_service:
    container_name: chats_service
    build: ./chats_service
    command: uvicorn app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      PORT_GATEWAY_PORT: ${PORT_GATEWAY_PORT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker

  chats-consumer:
    container_name: chats-consumer
    build: ./chats_service
    command: python -m app.endpoint_consumer
    environment:
      PORT_CHATS_SERVICE: ${PORT_CHATS_SERVICE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      - postgres
      - broker
    restart: unless-stopped
    
volumes:
  kafka-data:
  llm_cache:
  postgres_data:
